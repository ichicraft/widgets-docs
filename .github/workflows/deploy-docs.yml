name: Deploy docs (MkDocs → GitHub Pages)

# The Boards release pipelines (widgets + the Widget Board web part) used to rebuild
# and publish this whole site in-line on every release. That build lives here now,
# fired by the notes push — so releases don't pay for it.
on:
    push:
        branches: [master]
        paths:
            - "docs/**"
            - "mkdocs.yml"
            - "requirements.txt"
            - ".github/workflows/deploy-docs.yml"
    workflow_dispatch: {}

# Publish through the Pages deployment API (Source = GitHub Actions), not a gh-pages push.
permissions:
    contents: read
    pages: write
    id-token: write

# If several widgets release in quick succession, coalesce to a single build of
# the latest state instead of one build per push.
concurrency:
    group: deploy-docs
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.x"
                  cache: pip
            - run: pip install -r requirements.txt
            - run: mkdocs build --site-dir ./site
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
